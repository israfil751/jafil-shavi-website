<svg xmlns="http://www.w3.org/2000/svg" width="140" height="320" viewBox="0 0 140 320">
    <!-- Bitki naxışı: bu şəkil şaquli təkrarlananda sonsuz sarmaşıq alınır -->

    <defs>
        <!-- Bir yarpaq: iki əyri xətt + ortadakı damar. (0,0) nöqtəsi yarpağın dibidir -->
        <g id="yarpaq">
            <path d="M0,0 C12,-14 34,-14 46,0 C34,14 12,14 0,0 Z" fill="#2f7a4a"/>
            <path d="M2,0 L42,0" stroke="#1b4d2e" stroke-width="1.2"/>
            <path d="M14,0 L22,-6 M24,0 L32,-5 M14,0 L22,6 M24,0 L32,5" stroke="#1b4d2e" stroke-width="0.8"/>
        </g>
        <g id="kicikYarpaq">
            <path d="M0,0 C7,-8 20,-8 26,0 C20,8 7,8 0,0 Z" fill="#4c9a63"/>
            <path d="M2,0 L23,0" stroke="#2f7a4a" stroke-width="0.8"/>
        </g>
        <!-- Kiçik çiçək: 5 ləçək + mərkəz -->
        <g id="cicek">
            <circle cx="0" cy="-5" r="4" fill="#f5efe0"/>
            <circle cx="4.8" cy="-1.5" r="4" fill="#f5efe0"/>
            <circle cx="3" cy="4" r="4" fill="#f5efe0"/>
            <circle cx="-3" cy="4" r="4" fill="#f5efe0"/>
            <circle cx="-4.8" cy="-1.5" r="4" fill="#f5efe0"/>
            <circle cx="0" cy="0" r="2.6" fill="#e9b949"/>
        </g>
    </defs>

    <!-- Əsas gövdə (hərəkət etmir). Yuxarı və aşağı ucları eyni nöqtədədir ki, təkrarlananda qırılmasın -->
    <path d="M40,0 C80,80 0,240 40,320" fill="none" stroke="#1b4d2e" stroke-width="3" stroke-linecap="round"/>

    <!-- Qıvrım budaqlar -->
    <path d="M48,106 C70,100 84,84 78,72 C74,64 64,68 68,76" fill="none" stroke="#2f7a4a" stroke-width="1.6"/>
    <path d="M32,214 C10,220 -2,236 4,248 C8,256 18,252 14,244" fill="none" stroke="#2f7a4a" stroke-width="1.6"/>

    <!-- Yarpaqlar: xarici <g> yarpağı yerinə qoyur, daxili <use> isə öz dibi (0,0) ətrafında fırlanaraq tərpənir.
         animateTransform — SVG-nin öz animasiya teqidir: values="-12;12;-12" → -12°-dən 12°-yə və geri, dur="6s" → 6 saniyə,
         begin — hər yarpaq fərqli anda başlayır ki, hamısı eyni vaxtda tərpənməsin -->
    <g transform="translate(51,41) rotate(-35)"><use href="#yarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="0s" repeatCount="indefinite"/></use></g>
    <g transform="translate(46,20) rotate(200)"><use href="#kicikYarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(48,106) rotate(205)"><use href="#yarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(45,135) rotate(-15)"><use href="#kicikYarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-3.6s" repeatCount="indefinite"/></use></g>
    <g transform="translate(40,160) rotate(25)"><use href="#yarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(37,185) rotate(170)"><use href="#kicikYarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-4.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(32,214) rotate(150)"><use href="#yarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-3.6s" repeatCount="indefinite"/></use></g>
    <g transform="translate(29,279) rotate(-20)"><use href="#yarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-4.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(33,300) rotate(195)"><use href="#kicikYarpaq"><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" begin="-1.2s" repeatCount="indefinite"/></use></g>

    <!-- Çiçəklər və tumurcuqlar -->
    <g transform="translate(96,52)"><use href="#cicek"><animateTransform attributeName="transform" type="rotate" values="-15;15;-15" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="8s" begin="0s" repeatCount="indefinite"/></use></g>
    <g transform="translate(84,186) scale(0.8)"><use href="#cicek"><animateTransform attributeName="transform" type="rotate" values="-15;15;-15" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="8s" begin="-2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(14,96) scale(0.7)"><use href="#cicek"><animateTransform attributeName="transform" type="rotate" values="-15;15;-15" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="8s" begin="-4.8s" repeatCount="indefinite"/></use></g>
    <circle cx="68" cy="76" r="3" fill="#86c79a"/>
    <circle cx="14" cy="244" r="3" fill="#86c79a"/>
    <circle cx="74" cy="236" r="2.4" fill="#86c79a"/>
</svg>
